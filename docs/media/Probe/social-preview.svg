  <text x="640" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" fill="#F8FAFC">Probe</text><text x="640" y="402" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="5" fill="#f566a4">AEGEANWORKS · LIBRARY</text>
  <text x="640" y="442" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">Local-first capability probe: a falsifiable CLI</text><text x="640" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">that runs an inspectable battery of environment</text><text x="640" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">checks - filesystem round-trip, shell execution …</text>
  <rect x="416" y="530" width="75" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="454" y="555" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">aikit</text><rect x="504" y="530" width="174" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="590" y="555" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">aikit integrated</text><rect x="690" y="530" width="174" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="776" y="555" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">source available</text>
