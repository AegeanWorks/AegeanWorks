  <text x="640" y="442" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">A local webhook inbox with replay. Point a webhook</text><text x="640" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">at it, inspect what arrived, then replay it to</text><text x="640" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">another target. Zero dependencies, Python 3.10+ …</text>
