  <desc id="desc">Shared content pipeline for the game portfolio: validated schemas plus a generator that emits per-game data packs, with the fairness validator as gatekeeper. Slice 1 targets crypt-crawler bosses; the target registry now also maps After Image, Aldervale, Shooter, Weft, Iris, Primordia, Cyberpulse and Fold from their own authored content, read-only.</desc>
